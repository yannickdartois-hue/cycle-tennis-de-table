name: Vérification de l'appli
# Lancée à chaque modification du dépôt. Croix rouge = un problème : ouvre le détail, la dernière ligne le décrit.
on:
  push:
  workflow_dispatch:
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le navigateur de test
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Vérifier (fichiers, hors ligne, synchro sans nom d'élève)
        run: python tests/verif.py
