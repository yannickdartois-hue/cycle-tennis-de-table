<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EA580C">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Cycle tennis de table</title>
<!-- Page FABRIQUÉE par mon-eps/atelier/ecran-de-cours/construire.py : ne pas la modifier à la main ici.
     Moteur commun : ecran.js et ecran.css. Propre à l'activité : le <style> et le <script> ci-dessous. -->
<link rel="stylesheet" href="ecran.css">
<style>
/* ===== Propre au cycle tennis de table : couleurs, niveaux, schémas ===== */
:root{--sol:#F3F5F8; --craie:#FFFFFF; --encre:#172033; --repere:#5A6475; --trait:#DDE2E8;
  --ligne:#EA580C; --ligne-fonce:#9A3412; --ligne-pale:#FDEBDD;
  --vert:#1D6B3A; --vert-pale:#E6F3EA; --alerte:#B42318; --alerte-pale:#FDE8E6;
  --facile:#2F6FB0; --facile-pale:#EAF2FB; --dur:#B4441C; --dur-pale:#FCEDE6;
  --d:"Archivo","Arial Narrow",Arial,sans-serif; --t:"Atkinson","Segoe UI",Roboto,Arial,sans-serif;
  --sur-encre:#FFFFFF; --fait:#9AA3AE;
  --c-p:#7A3DB8; --c-p-pale:#F1E8FB; --c-t:#1F4FA8; --c-t-pale:#E3EBF8; --c-a:#9D174D; --c-a-pale:#FCE7F3; --sur-niv:#FFFFFF;}
body.niv-p{--niv:var(--c-p);--niv-pale:var(--c-p-pale)}
body.niv-t{--niv:var(--c-t);--niv-pale:var(--c-t-pale)}
body.niv-a{--niv:var(--c-a);--niv-pale:var(--c-a-pale)}
:root[data-theme="dark"]{
  --sol:#11161D; --craie:#1B222C; --encre:#E9EEF3; --repere:#9AA5B3; --trait:#323C49; --sur-encre:#11161D; --fait:#5B6573;
  --ligne:#FB923C; --ligne-fonce:#FDBA74; --ligne-pale:#3A1D0E;
  --vert:#6FD39F; --vert-pale:#15301F; --alerte:#FF8A80; --alerte-pale:#3A1A18;
  --facile:#7FB0E8; --facile-pale:#162638; --dur:#F29470; --dur-pale:#3A2018;
  --c-p:#C39BF0; --c-p-pale:#2C1F3F; --c-t:#8FB4F2; --c-t-pale:#1B2A44; --c-a:#F9A8D4; --c-a-pale:#3B1328; --sur-niv:#11161D; color-scheme:dark}
.schema,.legende-o{--bg:#f2f4f7; --surface:#ffffff; --surface-2:#e8edf3; --fg:#14202e; --muted:#566476; --line:#ccd5df;
  --court:#2f6f9f; --court-line:#ffffff; --net:#14202e;
  --accent:#1f4fa8; --accent-fg:#ffffff; --ball:#d18a00; --team-b:#c2410c; --team-n:#6b7787;
  --ok:#1f7a4d; --ok-bg:#dff3e8; --warn:#9a5b00; --warn-bg:#fdf0d5; --done:#6b7787; --done-bg:#e6eaef;
  --cy-p:#7a3db8; --cy-p-bg:#f1e8fb; --cy-t:#1f4fa8; --cy-t-bg:#e3ebf8;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
;--bg:#fff;--surface:#fff;--surface-2:#eef1f5;--fg:#111;--muted:#444;--line:#999;--sport:#1d4ed8}
.schema{background:#fff;color:#14202e;border-radius:14px;padding:8px;font-family:var(--t)}
.legende-o{margin:8px 4px 0;font-size:max(14px,var(--fs-min,15px));color:var(--repere)}
.legende-o .legend{display:flex;flex-wrap:wrap;gap:4px 14px}
.legende-o i{display:inline-block;vertical-align:middle;margin-right:4px}
.legende-o .dot{width:12px;height:12px;border-radius:50%}
.legende-o .lineb{width:22px;border-top:2px dashed currentColor}
.legende-o .liner{width:22px;border-top:2px solid currentColor}
.schema .legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:max(12px,var(--fs-min,15px));color:var(--muted);margin-top:4px}
.schema .legend i{display:inline-block;vertical-align:middle;margin-right:4px}
.schema .dot{width:10px;height:10px;border-radius:50%}
.schema .liner{width:22px;border-top:2px solid var(--fg)}
.schema .c-floor{fill:var(--court)}
.schema .c-line{stroke:var(--court-line);stroke-width:2;fill:none}
.schema .c-net{stroke:var(--net);stroke-width:4}
.schema .c-zone{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-opacity:.5;stroke-dasharray:4 4}
.schema .c-zonet{fill:var(--accent);font:600 max(11px,var(--fs-min,15px)) var(--font-body)}
.schema .c-target{fill:var(--ball);fill-opacity:.25;stroke:var(--ball);stroke-width:1.5}
.schema .c-pa{fill:var(--accent)}
.schema .c-pb{fill:var(--team-b)}
.schema .c-pn{fill:var(--team-n)}
.schema .c-pt{fill:#ffffff;font:700 max(12px,var(--fs-min,15px)) var(--font-body);text-anchor:middle;dominant-baseline:central}
.schema .c-ball{stroke:var(--ball);stroke-width:2;stroke-dasharray:6 4;fill:none}
.schema .c-run{stroke:var(--fg);stroke-width:2;fill:none}
.schema .c-head-b{fill:var(--ball)}
.schema .c-head-r{fill:var(--fg)}
.schema .c-label{fill:var(--fg);font:600 max(12px,var(--fs-min,15px)) var(--font-body)}
.schema .c-say{fill:var(--fg);font:italic 600 max(12px,var(--fs-min,15px)) var(--font-body)}
.schema .teq-sch .c-label,.schema .teq-sch .c-say{font-size:23px;font-weight:700}
.schema .teq-sch .c-pt{font-size:20px}
.schema .legend{display:none}
.schema .legend{font-size:7.5pt}
.schema .c-mid{stroke:var(--court-line);stroke-width:1.3;stroke-dasharray:5 4;fill:none;opacity:.8}
.schema .c-edge{fill:var(--fg);opacity:.12}
.schema .c-netpost{fill:var(--net)}
.schema .c-zone{fill:#ffffff;fill-opacity:.16;stroke:#ffd166;stroke-width:1.6;stroke-dasharray:5 3}
.schema .c-zone.no{fill:#e5484d;fill-opacity:.28;stroke:#e5484d}
.schema .c-zonet{fill:#ffe9a8;font:700 max(11px,var(--fs-min,15px)) var(--font-body)}
.schema .c-labt{fill:#ffffff;font:600 max(12px,var(--fs-min,15px)) var(--font-body)}
.schema .c-bounce{fill:var(--ball);stroke:#fff;stroke-width:1.2}
.schema .c-fold{fill:var(--court);opacity:.95}
.schema .c-basket{fill:var(--surface);stroke:var(--fg);stroke-width:1.6}
.schema .c-sheet{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.schema .c-tbl{fill:var(--court)}
.schema .c-tbll{stroke:var(--court-line);stroke-width:1.5;fill:none}
.schema .c-move{stroke:var(--ok);stroke-width:2.2;fill:none}
.schema .c-head-g{fill:var(--ok)}
.schema .c-down{stroke:var(--team-b);stroke-width:2.2;fill:none}
.schema .c-head-o{fill:var(--team-b)}
.schema .c-tnum{fill:var(--fg);font:700 max(13px,var(--fs-min,15px)) var(--font-display)}
.schema .lineo{width:22px;border-top:2px dashed var(--ball)}
.cy button[data-cy=p].on{background:var(--c-p);color:var(--sur-niv)}
.pc.niv-p .sc.jour{outline-color:var(--c-p)}
.pc.niv-p{--nivp:var(--c-p)}
.cy button[data-cy=a].on{background:var(--c-a);color:var(--sur-niv)}
.pc.niv-a .sc.jour{outline-color:var(--c-a)}
.pc.niv-a{--nivp:var(--c-a)}
/* Téléphone : frise sans libellés tronqués (le nom de l'étape est dans la carte), barre du bas tenue dans l'écran */
@media (max-width:560px){.blocs span{display:none}.blocs b{font-size:max(14px,var(--fs-min,15px))}.pouce{gap:6px;padding-left:10px;padding-right:10px}.pouce .bt{flex:1 1 0;min-width:0;padding:0 6px;font-size:15px;white-space:normal;line-height:1.1;text-align:center}}
</style>
<style>/* Lisibilité terrain : textes à 15 px minimum à l'écran ; tailles d'origine à l'impression. */@media print{:root{--fs-min:0px}}</style>
</head>
<body>
<header class="barre">
  <img src="icon-192.png" alt="">
  <div class="app">Tennis de table<small>Lycée Pompidou</small></div>
  <span class="pastille-niv" id="cyPast">Tle</span>
  <div class="titre" id="titre"></div>
  <a class="bt clair" id="prep" href="outils.html">Préparer</a>
</header>
<div class="trace"></div>
<div class="niveau" id="niveau"></div>
<section class="deroule" id="deroule" aria-label="Déroulé de la séance"></section>
<main class="zone" id="zone"></main>
<footer class="pouce">
  <button class="bt bord" id="btSeances" type="button">‹ Séances</button>
  <button class="bt bord" id="btOutils" type="button">Outils</button>
  <button class="bt bord" id="btAjuster" type="button">Ajuster le déroulé</button>
  <div class="info" id="info"></div>
</footer>
<div id="couche"></div>

<script src="tennis-de-table-donnees.js"></script>
<script>
'use strict';
/* Écran de cours — tennis de table : ce qui est propre à l'activité.
   Source : mon-eps/atelier/ecran-de-cours/apps/. Le moteur commun est ecran.js. */
let CUR_A='t';   /* leçons en autonomie : Terminale (at) ou Première (ap) */
const APP={
  old:'outils.html',
  cle:'tq',
  niv:{p:{label:'Première',court:'1re',long:'PREMIÈRE',L:P_SESSIONS},t:{label:'Terminale',court:'Tle',long:'TERMINALE',L:T_SESSIONS},a:{label:'Autonomie',court:'Auto',long:'AUTONOMIE',L:A_SESSIONS}},
  defaut:'t',
  lienOld:(c,id)=>c==='a'?APP.old+'#a-'+CUR_A+'-'+id:APP.old+'#g-'+c+'-'+id,
  lireCur(){const o=lire('tt-cur',{})||{},c=o.cur||{};CUR_A=c.ap&&!c.at?'p':'t';return Object.assign({},c,{a:c.at||c.ap||''})},
  marquerJour(c,id){const o=lire('tt-cur',{})||{},cur=Object.assign({t:'',p:'',at:'',ap:''},o.cur||{});cur[c==='a'?'a'+CUR_A:c]=id;const up=Date.now();
    ecrire('tt-cur',{cur,updated:up});if(c==='a')CUR.a=id;else CUR[c]=id;
    const L=lire('tt-tournois',{})||{};L.prefs={id:'prefs',kind:'prefs',type:'prefs',cur:Object.assign({},cur),updated:up};ecrire('tt-tournois',L)},
  outils:[{"titre": "Pendant le cours", "items": [["rot", "Tournois", "montante-descendante · ronde suisse"], ["atp", "Défi ATP", "classement à points"], ["warm", "Échauffements", "7 situations"], ["equipe", "Échauffement d’équipe", "S3–S7 · fiche à imprimer"]]}, {"titre": "Adapter", "items": [["beg", "Débutants", "situations collège"], ["bank", "Banque d’exercices", "6 catégories · N1–N4"], ["diff", "Travail par niveaux", "tests d’orientation"], ["coach", "Repères de spécialiste", "règles · FFTT · sécurité"]]}, {"titre": "Évaluer", "items": [["obs", "Plan d’observation", "AFL2 · AFL3 · qui, quand"], ["evalf", "Fiche d’évaluation", "S9 · grille et notes"], ["check", "Lien avec l’éval", "référentiel Pompidou"]]}, {"titre": "Travail en autonomie (GAREEPS)", "a": 1, "items": [["suivi", "Suivi de classe", "thèmes · niveaux · tables"], ["catalogue", "Catalogue", "14 thèmes · 34 exercices"], ["auto", "Auto-évaluation", "grille L1 · étoile"], ["carnet", "Carnet d’entraînement", "fiche élève à imprimer"], ["demarche", "La démarche", "GAREEPS · organisation"]]}],
  urlOutil:(id,auto)=>{const c=J.c==='a'?CUR_A:J.c;return APP.old+'#'+(auto?'a':'g')+'-'+c+'-'+id},
  racc:[[/^warm$/,'warm','Fiches d’échauffement'],[/bouton tournoi|onglet tournois|montante-descendante|rencontres? en relais|rencontre blanche/i,'rot','Ouvrir le tournoi'],[/défi atp/i,'atp','Ouvrir le Défi ATP'],[/onglet suivi/i,'suivi','Suivi de classe',1],[/catalogue/i,'catalogue','Catalogue',1],[/auto-évaluation|grille d’observation/i,'auto','Grille et étoile',1]],
  schemaDe:e=>{if(!e||!e.sch||!SCH[e.sch])return '';const sp=SCH[e.sch];return `<div class="schema">${sp.salle?salle(sp):tt(sp)}</div><div class="legende-o">${LEGEND}</div>${sp.cap?`<p class="cap">${sp.cap}</p>`:''}`}
};
</script>
<script src="ecran.js"></script>
</body>
